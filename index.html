  <script src="app.js"></script>

  <script>
    (function () {
      const totalbar = document.getElementById('totalbar');
      const toggle = document.getElementById('drawerToggle');
      if (!totalbar || !toggle) return;

      toggle.addEventListener('click', () => {
        const isOpen = totalbar.classList.toggle('open');
        toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      });
    })();
  </script>


  <!-- Hide logo when scrolling down -->
  <script>
    (function () {
      const header = document.getElementById('topbar');
      if (!header) return;

      function setHeaderHeightVar() {
        const h = Math.ceil(header.getBoundingClientRect().height);
        document.documentElement.style.setProperty('--header-h', h + 'px');
      }

      window.addEventListener('load', setHeaderHeightVar);
      window.addEventListener('resize', setHeaderHeightVar);
      window.addEventListener('orientationchange', setHeaderHeightVar);
      window.addEventListener('scroll', setHeaderHeightVar, { passive: true });

      setHeaderHeightVar();
    })();
  </script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const topbar = document.getElementById("topbar");
    if (!topbar) return;

    function updateHeader() {
      if (window.scrollY > 5) topbar.classList.add("hide-up");
      else topbar.classList.remove("hide-up");
    }

    window.addEventListener("scroll", updateHeader, { passive: true });
    updateHeader(); // run once on load
  });
</script>

<script>
  (function () {
    const splash = document.getElementById("splash");
    if (!splash) return;

    setTimeout(() => {
      splash.classList.add("hide");
      setTimeout(() => splash.remove(), 450);
    }, 2500);
  })();
